<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人理财 · ps_web</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { background: #f5f6f8; }
    .scheme-card {
      display: block; text-decoration: none; color: inherit;
      border: none; border-radius: .75rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: all .2s ease;
    }
    .scheme-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }
    .scheme-big { font-size: 2.2rem; font-weight: 700; line-height: 1.2; }
    .scheme-soon { opacity: .55; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid d-flex align-items-center">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand mb-0 h1" href="/">首页</a>
          <div class="dropdown">
            <a class="app-nav dropdown-toggle" href="#" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">市场分析</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/stock">个股行情</a></li>
              <li><a class="dropdown-item" href="/index">指数行情</a></li>
              <li><a class="dropdown-item" href="/industry">行业观察</a></li>
              <li><a class="dropdown-item" href="/stockpredict">个股预测</a></li>
              <li><a class="dropdown-item" href="/predict">宏观预测</a></li>
              <li><a class="dropdown-item" href="/strategy">买卖策略</a></li>
            </ul>
          </div>
          <a class="app-nav active" href="/finance">个人理财</a>
        </div>
        <a class="app-nav ms-auto" href="/tasks">任务中心</a>
      </div>
    </nav>

    <main class="container my-4">
      <h4 class="mb-1">个人理财</h4>
      <p class="text-muted small mb-4">定期记录与回顾自己的资产配置和理财进展</p>

      <div class="row g-4">
        <div class="col-md-6 col-lg-4">
          <a class="card scheme-card h-100" href="/finance/portfolio">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="card-title mb-1">资产总览与调仓</h6>
                  <span class="badge bg-secondary" style="font-size:.72rem">标的级持仓 · 目标配置 · IRR</span>
                </div>
                <span class="scheme-big">💰</span>
              </div>
              <p class="card-text text-muted small mt-2 mb-2">
                三档风险分类树管理标的（可关联库内行情），录入余额与移仓，
                按目标配置计算调仓差额，余额法 XIRR 估算各标的年化。
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small">总览与调仓</span>
                <span class="text-primary small">进入 →</span>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card scheme-card h-100 scheme-soon">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="card-title mb-1">定投回顾</h6>
                  <span class="badge bg-secondary" style="font-size:.72rem">规划中</span>
                </div>
                <span class="scheme-big">🗓️</span>
              </div>
              <p class="card-text text-muted small mt-2 mb-2">
                对接定投实验室，回顾各标的定投投入、收益率与计划的执行情况。
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small">后续迭代</span>
              </div>
            </div></div>
          </div>
      </div>
    </main>
  </div>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
