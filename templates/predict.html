<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏观预测 · ps_web</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { background: #f5f6f8; }
    /* 方案卡片：整卡可点击 */
    .scheme-card {
      display: block; text-decoration: none; color: inherit;
      border: none; border-radius: .75rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: all .2s ease;
    }
    .scheme-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }
    .scheme-score { font-size: 2.6rem; font-weight: 700; line-height: 1; }
    .scheme-spark { width: 100%; height: 64px; }
    .scheme-tag { font-size: .72rem; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid d-flex align-items-center">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand mb-0 h1" href="/">首页</a>
          <a class="app-nav" href="/stock">个股行情</a>
          <a class="app-nav" href="/index">指数行情</a>
          <a class="app-nav active" href="/predict">宏观预测</a>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <h4 class="mb-1">宏观预测</h4>
      <p class="text-muted small mb-4">基于市场数据的预测方案集合，点击卡片进入</p>

      <div class="row g-4">
        <div class="col-md-6 col-lg-4">
          <a class="card scheme-card h-100" href="/predict/sentiment">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="card-title mb-1">市场情绪</h6>
                  <span class="badge bg-secondary scheme-tag">八因子合成 · 日频</span>
                </div>
                <span class="scheme-score" :style="{color: scoreColor}">{{ score ?? '—' }}</span>
              </div>
              <p class="card-text text-muted small mt-2 mb-2">
                涨跌比、涨停连板、量能换手、两融北向、离散度八因子按历史分位数合成的市场温度计（0-100）。
              </p>
              <div id="spark" class="scheme-spark"></div>
              <div class="d-flex justify-content-between align-items-center mt-1">
                <span class="text-muted small">{{ zone }} · {{ date }}</span>
                <span class="text-primary small">进入 →</span>
              </div>
            </div>
          </a>
        </div>
        <!-- 后续新增的预测方案在这里加一块卡片 -->
      </div>
    </main>
  </div>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/echarts/echarts.min.js"></script>
  <script src="/static/js/predict.js"></script>
</body>
</html>
