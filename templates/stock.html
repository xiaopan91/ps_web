<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个股行情 · ps_web</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .search-box { position: relative; }
    .search-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
      background: #fff; border: 1px solid #ddd; border-radius: .375rem;
      max-height: 320px; overflow-y: auto; box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
    }
    .search-list .item { padding: .4rem .75rem; cursor: pointer; }
    .search-list .item:hover { background: #f1f3f5; }
    .up { color: #ef4444; }
    .down { color: #22c55e; }
    #chart { width: 100%; height: 560px; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">ps_web</span>
        <a class="nav-link text-white-50 d-none d-md-inline" href="/">首页</a>
        <a class="nav-link text-white-50 d-none d-md-inline" href="/sentiment">市场情绪</a>
      </div>
    </nav>

    <main class="container my-3">
      <!-- 搜索 + 信息栏 -->
      <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
        <div class="search-box" style="min-width: 260px;">
          <input class="form-control" v-model="query" @input="onInput" @blur="suggests = []"
                 @keydown.escape="suggests = []" placeholder="输入代码或名称，如 000001 / 平安">
          <div class="search-list list-unstyled mb-0" v-if="suggests.length">
            <div class="item" v-for="s in suggests" :key="s.ts_code"
                 @mousedown.prevent="pick(s)">
              <strong>{{ s.name }}</strong>
              <span class="text-muted ms-2">{{ s.ts_code }}</span>
              <span class="text-muted ms-2" v-if="s.industry">{{ s.industry }}</span>
            </div>
          </div>
        </div>

        <template v-if="info">
          <h5 class="mb-0">{{ info.name }} <span class="text-muted fs-6">{{ info.ts_code }}</span></h5>
          <span class="badge bg-secondary" v-if="info.industry">{{ info.industry }}</span>
          <span class="badge bg-light text-dark" v-if="info.market">{{ info.market }}</span>
        </template>

        <template v-if="latest">
          <span class="fs-4" :class="latest.pct >= 0 ? 'up' : 'down'">{{ latest.close.toFixed(2) }}</span>
          <span :class="latest.pct >= 0 ? 'up' : 'down'">
            {{ latest.pct >= 0 ? '+' : '' }}{{ latest.pct.toFixed(2) }}%
          </span>
          <span class="text-muted small">{{ latest.trade_date }}</span>
        </template>
      </div>

      <!-- 区间 + 复权 -->
      <div class="d-flex flex-wrap gap-4 mb-3 align-items-center">
        <div class="btn-group btn-group-sm" role="group">
          <button v-for="r in ranges" :key="r.k" class="btn" type="button"
                  :class="range === r.k ? 'btn-primary' : 'btn-outline-primary'"
                  @click="range = r.k">{{ r.label }}</button>
        </div>
        <div class="btn-group btn-group-sm" role="group">
          <button v-for="a in adjusts" :key="a.k" class="btn" type="button"
                  :class="adjust === a.k ? 'btn-secondary' : 'btn-outline-secondary'"
                  @click="adjust = a.k">{{ a.label }}</button>
        </div>
        <span class="text-muted small" v-if="loading">加载中…</span>
        <span class="text-danger small" v-if="error">{{ error }}</span>
      </div>

      <div id="chart"></div>
    </main>
  </div>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/vendor/echarts/echarts.min.js"></script>
  <script src="/static/js/stock.js"></script>
</body>
</html>
