<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>买卖策略 · ps_web</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { background: #f5f6f8; }
    .scheme-card {
      display: block; text-decoration: none; color: inherit;
      border: none; border-radius: .75rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: all .2s ease;
    }
    .scheme-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }
    .scheme-big { font-size: 2.2rem; font-weight: 700; line-height: 1.2; }
  </style>
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid d-flex align-items-center">
        <div class="d-flex align-items-center gap-3">
          <a class="navbar-brand mb-0 h1" href="/">首页</a>
          <a class="app-nav" href="/stock">个股行情</a>
          <a class="app-nav" href="/index">指数行情</a>
          <a class="app-nav" href="/predict">宏观预测</a>
          <a class="app-nav active" href="/strategy">买卖策略</a>
        </div>
        <a class="app-nav ms-auto" href="/tasks">任务中心</a>
      </div>
    </nav>

    <main class="container my-4">
      <h4 class="mb-1">买卖策略</h4>
      <p class="text-muted small mb-4">交易策略的回测与验证，点击卡片进入</p>

      <div class="row g-4">
        <div class="col-md-6 col-lg-4">
          <a class="card scheme-card h-100" href="/strategy/grid">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="card-title mb-1">网格交易</h6>
                  <span class="badge bg-secondary" style="font-size:.72rem">等比网格 · 日线回测</span>
                </div>
                <span class="scheme-big">⊞</span>
              </div>
              <p class="card-text text-muted small mt-2 mb-2">
                等比对称网格：下穿格线买入、上穿一格卖出，震荡市收割价差。
                选标的、调参数，十年历史一键回测对比买入持有。
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small">回测实验室</span>
                <span class="text-primary small">进入 →</span>
              </div>
            </div>
          </a>
        </div>
        <!-- 后续新增的交易策略在这里加一块卡片 -->
      </div>
    </main>
  </div>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/js/strategy.js"></script>
</body>
</html>
